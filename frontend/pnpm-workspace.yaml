autoInstallPeers: false
engineStrict: true
trustPolicy: no-downgrade
minimumReleaseAge: 7200
overrides:
  eslint-config-prettier: 10.1.8
  semver: 7.8.2
  rollup: 4.61.0
trustPolicyExclude:
  - 'vite'
  - '@mui/x-tree-view'
peerDependencyRules:
  ignoreMissing:
    # Optional form-js feature of camunda-bpmn-js; bpmn-tool does not use forms.
    - '@bpmn-io/form-js'
allowBuilds:
  esbuild: true
  '@carbon/icons': false
  '@parcel/watcher': false
  unrs-resolver: false
