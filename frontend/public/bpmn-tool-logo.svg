<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title">
  <title id="title">BPMN Tool — K processus</title>
  <defs>
    <linearGradient id="bg" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#1769e0"/>
      <stop offset="100%" stop-color="#0645ad"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical alignment: both events connect directly to the gateway -->
    <path d="M23 27 V38"/>
    <path d="M23 69 V58"/>
    <!-- Smooth outgoing branches from the gateway to the two tasks -->
    <path d="M33 45 C47 41 52 27 68 27"/>
    <path d="M33 51 C47 55 52 69 68 69"/>
  </g>
  <g fill="#1769e0" stroke="#fff" stroke-width="3.5">
    <circle cx="23" cy="19" r="8"/>
    <circle cx="23" cy="77" r="8"/>
    <rect x="68" y="18" width="21" height="17" rx="4"/>
    <rect x="68" y="61" width="21" height="17" rx="4"/>
  </g>
  <!-- Filled BPMN gateway, centered on the same vertical axis as both events -->
  <path d="M23 38 L33 48 L23 58 L13 48 Z" fill="#fff"/>
  <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M63 27l5-3-1 6"/>
    <path d="M63 69l5 3-1-6"/>
  </g>
</svg>
