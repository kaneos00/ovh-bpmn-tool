<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
<title id="title">Exemple BPMN : passerelle exclusive</title><desc id="desc">Après vérification, une passerelle exclusive choisit entre demande complète et demande incomplète.</desc>
<rect width="900" height="280" fill="#fff"/><rect x="18" y="18" width="864" height="244" rx="4" fill="none" stroke="#555" stroke-width="1.5"/><text x="36" y="43" font-family="Arial,sans-serif" font-size="15" fill="#333">Décider selon le résultat de la vérification</text>
<circle cx="72" cy="145" r="18" fill="#fff" stroke="#333" stroke-width="2"/><path d="M90 145 H150" stroke="#333" stroke-width="2"/><path d="M142 139 L150 145 L142 151" stroke="#333" stroke-width="2" fill="none"/>
<rect x="150" y="111" width="190" height="68" rx="10" fill="#fff" stroke="#333" stroke-width="2"/><text x="245" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#333">Vérifier la demande</text>
<path d="M340 145 H408" stroke="#333" stroke-width="2"/><path d="M400 139 L408 145 L400 151" stroke="#333" stroke-width="2" fill="none"/>
<polygon points="440,113 472,145 440,177 408,145" fill="#fff" stroke="#333" stroke-width="2"/><path d="M427 132 L453 158 M453 132 L427 158" stroke="#333" stroke-width="2"/>
<path d="M472 145 H535 V91 H595" stroke="#333" stroke-width="2" fill="none"/><path d="M587 85 L595 91 L587 97" stroke="#333" stroke-width="2" fill="none"/><text x="522" y="79" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#333">Oui</text>
<rect x="595" y="59" width="210" height="62" rx="10" fill="#fff" stroke="#333" stroke-width="2"/><text x="700" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#333">Poursuivre le traitement</text><text x="700" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">Demande complète</text>
<path d="M472 145 H535 V207 H595" stroke="#333" stroke-width="2" fill="none"/><path d="M587 201 L595 207 L587 213" stroke="#333" stroke-width="2" fill="none"/><text x="522" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#333">Non</text>
<rect x="595" y="176" width="210" height="62" rx="10" fill="#fff" stroke="#333" stroke-width="2"/><text x="700" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#333">Demander un complément</text><text x="700" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">Demande incomplète</text>
</svg>