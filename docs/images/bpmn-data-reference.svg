<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Exemple BPMN : fichier de référence partagé</title><desc id="desc">Deux processus utilisent le même magasin de données persistant. Le premier met à jour le référentiel, le second le consulte.</desc>
<rect width="1000" height="360" fill="#fff"/>
<rect x="18" y="18" width="964" height="145" rx="4" fill="none" stroke="#555" stroke-width="1.5"/><text x="36" y="42" font-family="Arial,sans-serif" font-size="15" fill="#333">Processus A — mettre à jour le référentiel</text>
<circle cx="77" cy="101" r="17" fill="#fff" stroke="#333" stroke-width="2"/><path d="M94 101 H150" stroke="#333" stroke-width="2"/><path d="M142 95 L150 101 L142 107" stroke="#333" stroke-width="2" fill="none"/>
<rect x="150" y="69" width="240" height="64" rx="10" fill="#fff" stroke="#333" stroke-width="2"/><text x="270" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#333">Remplir le fichier</text><text x="270" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#333">de référence</text>
<path d="M390 101 H540" stroke="#333" stroke-width="1.8" stroke-dasharray="6 5" fill="none"/><path d="M531 95 L540 101 L531 107" stroke="#333" stroke-width="1.8" fill="none"/>
<path d="M560 68 H625 L650 93 V137 H560 Z" fill="#fff" stroke="#333" stroke-width="2"/><path d="M625 68 V93 H650" fill="none" stroke="#333" stroke-width="1.5"/><text x="603" y="109" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#333">Fichier</text><text x="603" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#333">référence</text>
<rect x="18" y="190" width="964" height="152" rx="4" fill="none" stroke="#555" stroke-width="1.5"/><text x="36" y="214" font-family="Arial,sans-serif" font-size="15" fill="#333">Processus B — consulter le référentiel</text>
<circle cx="77" cy="273" r="17" fill="#fff" stroke="#333" stroke-width="2"/><path d="M94 273 H150" stroke="#333" stroke-width="2"/><path d="M142 267 L150 273 L142 279" stroke="#333" stroke-width="2" fill="none"/>
<rect x="150" y="241" width="240" height="64" rx="10" fill="#fff" stroke="#333" stroke-width="2"/><text x="270" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#333">Consulter le référentiel</text><text x="270" y="287" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#333">Appliquer les règles</text>
<path d="M390 273 H560" stroke="#333" stroke-width="1.8" stroke-dasharray="6 5" fill="none"/><path d="M551 267 L560 273 L551 279" stroke="#333" stroke-width="1.8" fill="none"/>
<path d="M580 239 H650 Q666 239 666 255 V291 Q666 307 650 307 H580 Q564 307 564 291 V255 Q564 239 580 239 Z" fill="#fff" stroke="#333" stroke-width="2"/><ellipse cx="615" cy="239" rx="35" ry="10" fill="#fff" stroke="#333" stroke-width="2"/><path d="M580 307 V319 Q615 336 650 319 V307" fill="none" stroke="#333" stroke-width="2"/><text x="615" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#333">Magasin de</text><text x="615" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#333">données</text>
<text x="730" y="160" font-family="Arial,sans-serif" font-size="12" fill="#555">Schéma conceptuel : les pointillés représentent</text><text x="730" y="176" font-family="Arial,sans-serif" font-size="12" fill="#555">des associations de données, pas une séquence.</text>
</svg>