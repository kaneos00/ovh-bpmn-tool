name: Validate

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Build
        working-directory: frontend
        run: pnpm build

  backend:
    name: Backend lint, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: backend
        run: pnpm exec eslint "{src,apps,libs,tests}/**/*.{ts,js}"
      - name: Build
        working-directory: backend
        run: pnpm build
      - name: Unit tests
        working-directory: backend
        run: pnpm exec jest --config ./tests/jest-unit.json --runInBand

  coolify-demo:
    name: Coolify demo images and Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_NAME: bpmn_v2_demo
      DATABASE_USER: bpmn_demo
      DATABASE_PASSWORD: ci-only-password
      DEMO_AUTH_USER: demo-v2
      DEMO_AUTH_PASSWORD: ci-only-demo-password
      DEMO_AUTH_GROUPS: bpmn-tool-readwrite-demo,bpmn-tool-admin-demo
      AUTH_SESSION_SECRET: ci-only-session-secret-with-at-least-32-bytes
      COMPOSE_PROJECT_NAME: bpmn-v2-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f deploy/coolify/compose.yaml config --quiet
      - name: Build backend image
        run: docker build --file deploy/coolify/Dockerfile.backend --tag bpmn-v2-demo-backend:ci .
      - name: Build frontend image
        run: docker build --file deploy/coolify/Dockerfile.frontend --tag bpmn-v2-demo-frontend:ci .
      - name: Build PostgreSQL image
        run: docker build --file deploy/coolify/Dockerfile.postgres --tag bpmn-v2-demo-postgres:ci .
      - name: Build database migration image
        run: docker build --file deploy/coolify/Dockerfile.migrations --tag bpmn-v2-demo-migrations:ci .
      - name: Smoke-test database, login, session and protected API
        run: |
          docker network create bpmn-v2-ci
          cleanup() {
            docker rm --force bpmn-v2-demo-frontend-ci bpmn-v2-demo-backend-ci bpmn-v2-demo-db-ci >/dev/null 2>&1 || true
            docker network rm bpmn-v2-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name bpmn-v2-demo-db-ci \
            --network bpmn-v2-ci --network-alias database \
            --env POSTGRES_DB="$DATABASE_NAME" \
            --env POSTGRES_USER="$DATABASE_USER" \
            --env POSTGRES_PASSWORD="$DATABASE_PASSWORD" \
            --env DEMO_AUTH_USER="$DEMO_AUTH_USER" \
            bpmn-v2-demo-postgres:ci
          # pg_isready can succeed while the official PostgreSQL image is still
          # running its initialization scripts. Wait for the seeded demo records too.
          seed_counts=""
          for attempt in $(seq 1 30); do
            seed_counts="$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT (SELECT count(*) FROM projects) || ':' || (SELECT count(*) FROM project_processes) || ':' || (SELECT count(*) FROM project_raci_entries)" 2>/dev/null || true)"
            if [ "$seed_counts" = "3:9:32" ]; then break; fi
            sleep 2
          done
          test "$seed_counts" = "3:9:32"
          # Ensure the combined BPMN example contains every process and every Call Activity target.
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "examples/organisation-demo/00-organisation-complete.bpmn"
          root = ET.parse(path).getroot()
          ns = {"bpmn": "http://www.omg.org/spec/BPMN/20100524/MODEL"}
          process_ids = {p.attrib["id"] for p in root.findall("bpmn:process", ns)}
          expected = {"Process_Recrutement", "Process_EvaluationCompetences", "Process_Formation", "Process_GouvernanceCapacites", "Process_DeveloppementLogiciel"}
          assert expected <= process_ids, f"Missing processes: {expected - process_ids}"
          targets = [a.attrib["calledElement"] for a in root.findall(".//bpmn:callActivity", ns)]
          assert len(targets) == 4, f"Expected 4 process calls, got {len(targets)}"
          assert set(targets) <= process_ids, f"Unresolved call targets: {set(targets) - process_ids}"
          print(f"Validated {len(process_ids)} processes and {len(targets)} resolved process calls")
          PY
          docker run --rm --network bpmn-v2-ci \
            --env PGPASSWORD="$DATABASE_PASSWORD" \
            --env DATABASE_USER="$DATABASE_USER" --env DATABASE_NAME="$DATABASE_NAME" \
            bpmn-v2-demo-migrations:ci sh -ec 'until pg_isready -h database -U "$DATABASE_USER" -d "$DATABASE_NAME"; do sleep 1; done; psql -v ON_ERROR_STOP=1 -h database -U "$DATABASE_USER" -d "$DATABASE_NAME" -f /opt/migrations/20261014_v2_1_process_provenance.sql; psql -v ON_ERROR_STOP=1 -h database -U "$DATABASE_USER" -d "$DATABASE_NAME" -f /opt/migrations/20261029_v3_user_theme_preference.sql'

          # Execute the explorer XPath against a real PostgreSQL server. This
          # exercises namespace-aware BPMN XML parsing, latest-published
          # selection, Call Activities and collapsed SubProcess resolution.
          docker exec -i bpmn-v2-demo-db-ci psql -v ON_ERROR_STOP=1 \
            -U "$DATABASE_USER" -d "$DATABASE_NAME" \
            < backend/tests/sql/explorer-links.integration.sql
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT count(*) FROM information_schema.columns WHERE table_name='resources' AND column_name='sourceResourceId'")" = "1"
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_name='app_user_preferences'")" = "1"

          docker run --detach --name bpmn-v2-demo-backend-ci --network bpmn-v2-ci --network-alias backend \
            --env NODE_ENV=production --env NODE_PORT=3000 \
            --env USER_HEADER=remote-user --env USER_GROUPS_HEADER=remote-user-groups \
            --env DEMO_AUTH_USER="$DEMO_AUTH_USER" --env DEMO_AUTH_PASSWORD="$DEMO_AUTH_PASSWORD" \
            --env DEMO_AUTH_GROUPS="$DEMO_AUTH_GROUPS" --env AUTH_SESSION_SECRET="$AUTH_SESSION_SECRET" \
            --env DATABASE_HOST=database --env DATABASE_PORT=5432 \
            --env DATABASE_USER="$DATABASE_USER" --env DATABASE_PASSWORD="$DATABASE_PASSWORD" \
            --env DATABASE_NAME="$DATABASE_NAME" --env DATABASE_SSL=off \
            bpmn-v2-demo-backend:ci

          for attempt in $(seq 1 30); do
            status="$(docker run --rm --network bpmn-v2-ci curlimages/curl:8.12.1 -sS -o /dev/null -w '%{http_code}' http://backend:3000/auth/session || true)"
            if [ "$status" = "401" ]; then break; fi
            sleep 2
          done
          test "$status" = "401"
          status="$(docker run --rm --network bpmn-v2-ci curlimages/curl:8.12.1 -sS -o /dev/null -w '%{http_code}' \
            -H 'content-type: application/json' -d '{"username":"demo-v2","password":"wrong"}' \
            http://backend:3000/auth/login || true)"
          test "$status" = "401"

          docker run --detach --name bpmn-v2-demo-frontend-ci --network bpmn-v2-ci \
            --publish 127.0.0.1:18080:80 \
            bpmn-v2-demo-frontend:ci
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/ || true)"
            if [ "$status" = "200" ]; then break; fi
            sleep 2
          done
          test "$status" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/bpmn-tool-logo.svg)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/bpmn-api/projects/administration/overview)" = "401"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'content-type: application/json' \
            --data '{"username":"demo-v2","password":"ci-only-demo-password"}' \
            --cookie-jar /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/login)"
          test "$status" = "200"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/projects/administration/overview)"
          test "$status" = "200"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/session)"
          test "$status" = "200"

          # Exercise local-account administration, email login, role mapping and password reset.
          created_user="$(curl --fail --silent --show-error \
            --cookie /tmp/bpmn-v2-ci.cookies \
            --header 'content-type: application/json' \
            --data '{"username":"ci-reader","email":"ci-reader@example.com","password":"ci-only-reader-password","role":"viewer"}' \
            http://127.0.0.1:18080/bpmn-api/auth/users)"
          echo "$created_user" | grep -q '"role":"viewer"'
          reader_id="$(printf '%s' "$created_user" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/users)"
          test "$status" = "200"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies \
            --request POST --header 'content-type: application/json' \
            --data '{"newPassword":"ci-reader-reset-password"}' \
            "http://127.0.0.1:18080/bpmn-api/auth/users/$reader_id/password")"
          test "$status" = "201"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'content-type: application/json' \
            --data '{"username":"ci-reader@example.com","password":"ci-reader-reset-password"}' \
            --cookie-jar /tmp/bpmn-v2-reader.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/login)"
          test "$status" = "200"

          reader_session="$(curl --fail --silent --show-error \
            --cookie /tmp/bpmn-v2-reader.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/session)"
          echo "$reader_session" | grep -q '"role":"viewer"'
          echo "$reader_session" | grep -q 'bpmn-tool-readonly-demo'

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-reader.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/users)"
          test "$status" = "403"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies --cookie-jar /tmp/bpmn-v2-ci.cookies \
            --request POST \
            "http://127.0.0.1:18080/bpmn-api/auth/users/$reader_id/impersonate")"
          test "$status" = "200"

          impersonated_session="$(curl --fail --silent --show-error \
            --cookie /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/session)"
          echo "$impersonated_session" | grep -q '"userId":"ci-reader"'
          echo "$impersonated_session" | grep -q '"role":"viewer"'
          echo "$impersonated_session" | grep -q '"impersonating":true'

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/users)"
          test "$status" = "403"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies --cookie-jar /tmp/bpmn-v2-ci.cookies \
            --request POST http://127.0.0.1:18080/bpmn-api/auth/impersonation/stop)"
          test "$status" = "200"

          admin_session="$(curl --fail --silent --show-error \
            --cookie /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/session)"
          echo "$admin_session" | grep -q '"role":"admin"'
          echo "$admin_session" | grep -q '"impersonating":false'

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/users)"
          test "$status" = "200"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-reader.cookies \
            --request POST --header 'content-type: application/json' \
            --data '{"currentPassword":"ci-reader-reset-password","newPassword":"ci-reader-final-password"}' \
            http://127.0.0.1:18080/bpmn-api/auth/password)"
          test "$status" = "201"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'content-type: application/json' \
            --data '{"username":"ci-reader","password":"ci-reader-final-password"}' \
            http://127.0.0.1:18080/bpmn-api/auth/login)"
          test "$status" = "200"

          workspace_payload="$(curl --fail --silent --show-error \
            --cookie /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/projects/me/workspace)"
          echo "$workspace_payload" | grep -q '"projects":'
          echo "$workspace_payload" | grep -q '"role":'
          echo "$workspace_payload" | grep -q '"usage":'

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies -X POST \
            http://127.0.0.1:18080/bpmn-api/auth/logout)"
          test "$status" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/bpmn-api/projects/administration/overview)" = "401"

  deploy-coolify:
    name: Deploy to Coolify test instance
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - coolify-demo
    # Keep CI independent from Coolify credentials. Never deploy feature/PR branches;
    # only an opted-in push to main may trigger the Coolify test instance deployment.
    # Verify COOLIFY_WEBHOOK_URL and COOLIFY_TOKEN before enabling the repository variable.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.COOLIFY_DEPLOY_ENABLED == 'true'
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "::error::GitHub Actions secret COOLIFY_WEBHOOK_URL is not configured."
            exit 1
          fi
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::GitHub Actions secret COOLIFY_TOKEN is not configured."
            exit 1
          fi
          curl --fail --silent --show-error --request GET --header "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK_URL"
