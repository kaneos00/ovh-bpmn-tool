name: Validate

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Build
        working-directory: frontend
        run: pnpm build

  backend:
    name: Backend lint, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: backend
        run: pnpm exec eslint "{src,apps,libs,tests}/**/*.{ts,js}"
      - name: Build
        working-directory: backend
        run: pnpm build
      - name: Unit tests
        working-directory: backend
        run: pnpm exec jest --config ./tests/jest-unit.json --runInBand

  coolify-demo:
    name: Coolify demo images and Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_NAME: bpmn_v2_demo
      DATABASE_USER: bpmn_demo
      DATABASE_PASSWORD: ci-only-password
      DEMO_AUTH_USER: demo-v2
      DEMO_AUTH_PASSWORD: ci-only-demo-password
      COMPOSE_PROJECT_NAME: bpmn-v2-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f deploy/coolify/compose.yaml config --quiet
      - name: Build backend image
        run: docker build --file deploy/coolify/Dockerfile.backend --tag bpmn-v2-demo-backend:ci .
      - name: Build frontend image
        run: docker build --file deploy/coolify/Dockerfile.frontend --tag bpmn-v2-demo-frontend:ci .
      - name: Build PostgreSQL image
        run: docker build --file deploy/coolify/Dockerfile.postgres --tag bpmn-v2-demo-postgres:ci .
      - name: Smoke-test demo database, API authorization and frontend proxy
        run: |
          docker network create bpmn-v2-ci
          cleanup() {
            docker rm --force bpmn-v2-demo-frontend-ci bpmn-v2-demo-backend-ci bpmn-v2-demo-db-ci >/dev/null 2>&1 || true
            docker network rm bpmn-v2-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name bpmn-v2-demo-db-ci \
            --network bpmn-v2-ci --network-alias database \
            --env POSTGRES_DB="$DATABASE_NAME" \
            --env POSTGRES_USER="$DATABASE_USER" \
            --env POSTGRES_PASSWORD="$DATABASE_PASSWORD" \
            --env DEMO_AUTH_USER="$DEMO_AUTH_USER" \
            bpmn-v2-demo-postgres:ci
          for attempt in $(seq 1 30); do
            if docker exec bpmn-v2-demo-db-ci pg_isready -U "$DATABASE_USER" -d "$DATABASE_NAME"; then
              break
            fi
            sleep 2
          done
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc 'SELECT count(*) FROM projects')" = "2"
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc 'SELECT count(*) FROM project_processes')" = "4"
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc 'SELECT count(*) FROM project_raci_entries')" = "6"

          docker run --detach --name bpmn-v2-demo-backend-ci --network bpmn-v2-ci --network-alias backend \
            --env NODE_ENV=production --env NODE_PORT=3000 \
            --env USER_HEADER=remote-user --env USER_GROUPS_HEADER=remote-user-groups \
            --env DATABASE_HOST=database --env DATABASE_PORT=5432 \
            --env DATABASE_USER="$DATABASE_USER" --env DATABASE_PASSWORD="$DATABASE_PASSWORD" \
            --env DATABASE_NAME="$DATABASE_NAME" --env DATABASE_SSL=off \
            bpmn-v2-demo-backend:ci

          for attempt in $(seq 1 30); do
            status="$(docker run --rm --network bpmn-v2-ci curlimages/curl:8.12.1 -sS -o /dev/null -w '%{http_code}' \
              -H 'remote-user: demo-v2' -H 'remote-user-groups: bpmn-tool-admin-demo' \
              http://backend:3000/projects/administration/overview || true)"
            if [ "$status" = "200" ]; then break; fi
            sleep 2
          done
          test "$status" = "200"

          status="$(docker run --rm --network bpmn-v2-ci curlimages/curl:8.12.1 -sS -o /dev/null -w '%{http_code}' \
            -H 'remote-user: demo-v2' -H 'remote-user-groups: bpmn-tool-readwrite-demo' \
            http://backend:3000/projects/administration/overview || true)"
          test "$status" = "403"

          docker run --detach --name bpmn-v2-demo-frontend-ci --network bpmn-v2-ci \
            --publish 127.0.0.1:18080:80 \
            --env DEMO_AUTH_USER="$DEMO_AUTH_USER" --env DEMO_AUTH_PASSWORD="$DEMO_AUTH_PASSWORD" \
            bpmn-v2-demo-frontend:ci
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --user "$DEMO_AUTH_USER:$DEMO_AUTH_PASSWORD" \
              http://127.0.0.1:18080/bpmn-api/projects/administration/overview || true)"
            if [ "$status" = "200" ]; then break; fi
            sleep 2
          done
          test "$status" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --user "$DEMO_AUTH_USER:$DEMO_AUTH_PASSWORD" http://127.0.0.1:18080/)" = "200"
