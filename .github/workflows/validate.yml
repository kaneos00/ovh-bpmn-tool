name: Validate

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Build
        working-directory: frontend
        run: pnpm build

  backend:
    name: Backend lint, build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: backend
        run: pnpm exec eslint "{src,apps,libs,tests}/**/*.{ts,js}"
      - name: Build
        working-directory: backend
        run: pnpm build
      - name: Unit tests
        working-directory: backend
        run: pnpm exec jest --config ./tests/jest-unit.json --runInBand

  coolify-demo:
    name: Coolify demo images and Compose config
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_NAME: bpmn_v2_demo
      DATABASE_USER: bpmn_demo
      DATABASE_PASSWORD: ci-only-password
      DEMO_AUTH_USER: demo-v2
      DEMO_AUTH_PASSWORD: ci-only-demo-password
      DEMO_AUTH_GROUPS: bpmn-tool-readwrite-demo,bpmn-tool-admin-demo
      AUTH_SESSION_SECRET: ci-only-session-secret-with-at-least-32-bytes
      COMPOSE_PROJECT_NAME: bpmn-v2-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f deploy/coolify/compose.yaml config --quiet
      - name: Build backend image
        run: docker build --file deploy/coolify/Dockerfile.backend --tag bpmn-v2-demo-backend:ci .
      - name: Build frontend image
        run: docker build --file deploy/coolify/Dockerfile.frontend --tag bpmn-v2-demo-frontend:ci .
      - name: Build PostgreSQL image
        run: docker build --file deploy/coolify/Dockerfile.postgres --tag bpmn-v2-demo-postgres:ci .
      - name: Build database migration image
        run: docker build --file deploy/coolify/Dockerfile.migrations --tag bpmn-v2-demo-migrations:ci .
      - name: Install Playwright Chromium for browser workflow
        run: |
          npm install --prefix /tmp/bpmn-playwright --no-save playwright@1.55.0
          node /tmp/bpmn-playwright/node_modules/playwright/cli.js install --with-deps chromium
      - name: Smoke-test database, login, session and protected API
        run: |
          docker network create bpmn-v2-ci
          cleanup() {
            docker rm --force bpmn-v2-demo-frontend-ci bpmn-v2-demo-backend-ci bpmn-v2-demo-db-ci >/dev/null 2>&1 || true
            docker network rm bpmn-v2-ci >/dev/null 2>&1 || true
          }
          trap 'exit_code=$?; if [ "$exit_code" -ne 0 ]; then echo "::group::Docker diagnostics after smoke-test failure"; for container in bpmn-v2-demo-frontend-ci bpmn-v2-demo-backend-ci bpmn-v2-demo-db-ci; do echo "--- logs: $container ---"; docker logs "$container" 2>&1 || true; done; echo "::endgroup::"; fi; cleanup; exit "$exit_code"' EXIT

          assert_status() {
            expected="$1"
            actual="$2"
            label="$3"
            if [ "$actual" != "$expected" ]; then
              echo "HTTP smoke test failed for $label: expected $expected, got $actual" >&2
              exit 1
            fi
            echo "HTTP smoke test passed: $label ($actual)"
          }

          docker run --detach --name bpmn-v2-demo-db-ci \
            --network bpmn-v2-ci --network-alias database \
            --env POSTGRES_DB="$DATABASE_NAME" \
            --env POSTGRES_USER="$DATABASE_USER" \
            --env POSTGRES_PASSWORD="$DATABASE_PASSWORD" \
            --env DEMO_AUTH_USER="$DEMO_AUTH_USER" \
            bpmn-v2-demo-postgres:ci
          # pg_isready can succeed while the official PostgreSQL image is still
          # running its initialization scripts. Wait for the seeded demo records too.
          seed_counts=""
          for attempt in $(seq 1 30); do
            seed_counts="$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT (SELECT count(*) FROM projects) || ':' || (SELECT count(*) FROM project_processes) || ':' || (SELECT count(*) FROM project_raci_entries)" 2>/dev/null || true)"
            if [ "$seed_counts" = "3:9:32" ]; then break; fi
            sleep 2
          done
          test "$seed_counts" = "3:9:32"
          # Ensure the combined BPMN example contains every process and every Call Activity target.
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "examples/organisation-demo/00-organisation-complete.bpmn"
          root = ET.parse(path).getroot()
          ns = {"bpmn": "http://www.omg.org/spec/BPMN/20100524/MODEL"}
          process_ids = {p.attrib["id"] for p in root.findall("bpmn:process", ns)}
          expected = {"Process_Recrutement", "Process_EvaluationCompetences", "Process_Formation", "Process_GouvernanceCapacites", "Process_DeveloppementLogiciel"}
          assert expected <= process_ids, f"Missing processes: {expected - process_ids}"
          targets = [a.attrib["calledElement"] for a in root.findall(".//bpmn:callActivity", ns)]
          assert len(targets) == 4, f"Expected 4 process calls, got {len(targets)}"
          assert set(targets) <= process_ids, f"Unresolved call targets: {set(targets) - process_ids}"
          print(f"Validated {len(process_ids)} processes and {len(targets)} resolved process calls")
          PY
          docker run --rm --network bpmn-v2-ci \
            --env PGPASSWORD="$DATABASE_PASSWORD" \
            --env DATABASE_USER="$DATABASE_USER" --env DATABASE_NAME="$DATABASE_NAME" \
            bpmn-v2-demo-migrations:ci sh -ec 'until pg_isready -h database -U "$DATABASE_USER" -d "$DATABASE_NAME"; do sleep 1; done; psql -v ON_ERROR_STOP=1 -h database -U "$DATABASE_USER" -d "$DATABASE_NAME" -f /opt/migrations/20261014_v2_1_process_provenance.sql; psql -v ON_ERROR_STOP=1 -h database -U "$DATABASE_USER" -d "$DATABASE_NAME" -f /opt/migrations/20261029_v3_user_theme_preference.sql; psql -v ON_ERROR_STOP=1 -h database -U "$DATABASE_USER" -d "$DATABASE_NAME" -f /opt/migrations/20261029_v3_content_change_comments.sql; psql -v ON_ERROR_STOP=1 -h database -U "$DATABASE_USER" -d "$DATABASE_NAME" -f /opt/migrations/20261102_v3_process_change_proposals.sql; psql -v ON_ERROR_STOP=1 -h database -U "$DATABASE_USER" -d "$DATABASE_NAME" -f /opt/migrations/20261104_v3_process_change_proposal_comments.sql; psql -v ON_ERROR_STOP=1 -h database -U "$DATABASE_USER" -d "$DATABASE_NAME" -f /opt/migrations/20261104_v3_process_change_proposal_remark_events.sql; psql -v ON_ERROR_STOP=1 -h database -U "$DATABASE_USER" -d "$DATABASE_NAME" -f /opt/migrations/20261105_v3_project_member_remark_permission.sql; psql -v ON_ERROR_STOP=1 -h database -U "$DATABASE_USER" -d "$DATABASE_NAME" -f /opt/migrations/20261105_v3_project_visual_identity.sql; psql -v ON_ERROR_STOP=1 -h database -U "$DATABASE_USER" -d "$DATABASE_NAME" -f /opt/migrations/20261106_add_project_default_validator.sql; psql -v ON_ERROR_STOP=1 -h database -U "$DATABASE_USER" -d "$DATABASE_NAME" -f /opt/migrations/20261108_v3_project_trigram.sql; psql -v ON_ERROR_STOP=1 -h database -U "$DATABASE_USER" -d "$DATABASE_NAME" -f /opt/migrations/20261109_v3_process_change_proposal_clarification_events.sql; psql -v ON_ERROR_STOP=1 -h database -U "$DATABASE_USER" -d "$DATABASE_NAME" -f /opt/migrations/20261110_v3_job_architecture.sql; psql -v ON_ERROR_STOP=1 -h database -U "$DATABASE_USER" -d "$DATABASE_NAME" -f /opt/migrations/20261110_v3_job_function_documents.sql'

          # Execute the explorer XPath against a real PostgreSQL server. This
          # exercises namespace-aware BPMN XML parsing, latest-published
          # selection, Call Activities and collapsed SubProcess resolution.
          docker exec -i bpmn-v2-demo-db-ci psql -v ON_ERROR_STOP=1 \
            -U "$DATABASE_USER" -d "$DATABASE_NAME" \
            < backend/tests/sql/explorer-links.integration.sql
          docker exec -i bpmn-v2-demo-db-ci psql -v ON_ERROR_STOP=1 \
            -U "$DATABASE_USER" -d "$DATABASE_NAME" \
            < backend/tests/sql/content-publication-transaction.integration.sql
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT count(*) FROM information_schema.columns WHERE table_name='resources' AND column_name='sourceResourceId'")" = "1"
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_name='app_user_preferences'")" = "1"
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT count(*) FROM information_schema.columns WHERE table_name='projects' AND column_name IN ('color', 'icon')")" = "2"
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT count(*) FROM information_schema.columns WHERE table_name='project_members' AND column_name='canSubmitRemarks'")" = "1"
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_name='process_change_proposals'")" = "1"
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_name='process_change_proposal_comments'")" = "1"
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_name='process_change_proposal_events'")" = "1"
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT count(*) FROM information_schema.columns WHERE table_name='projects' AND column_name='defaultValidatorUserId'")" = "1"
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT count(*) FROM information_schema.columns WHERE table_name='projects' AND column_name='trigram'")" = "1"
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_name IN ('job_functions', 'competency_blocks', 'competencies', 'job_function_competency_blocks', 'project_job_positions', 'position_competency_blocks', 'position_raci_actor_mappings', 'position_activity_mappings', 'position_competency_requirements', 'job_function_activity_sections', 'job_function_custom_sections')")" = "11"
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT count(*) FROM information_schema.table_constraints WHERE constraint_name IN ('position_activity_mappings_position_block_fk', 'position_competency_requirements_position_block_fk', 'position_competency_requirements_competency_fk')")" = "3"
          test "$(docker exec bpmn-v2-demo-db-ci psql -U "$DATABASE_USER" -d "$DATABASE_NAME" -Atc "SELECT count(DISTINCT trigger_name) FROM information_schema.triggers WHERE trigger_name='position_raci_actor_project_guard'")" = "1"

          docker run --detach --name bpmn-v2-demo-backend-ci --network bpmn-v2-ci --network-alias backend \
            --env NODE_ENV=production --env NODE_PORT=3000 \
            --env USER_HEADER=remote-user --env USER_GROUPS_HEADER=remote-user-groups \
            --env DEMO_AUTH_USER="$DEMO_AUTH_USER" --env DEMO_AUTH_PASSWORD="$DEMO_AUTH_PASSWORD" \
            --env DEMO_AUTH_GROUPS="$DEMO_AUTH_GROUPS" --env AUTH_SESSION_SECRET="$AUTH_SESSION_SECRET" \
            --env DATABASE_HOST=database --env DATABASE_PORT=5432 \
            --env DATABASE_USER="$DATABASE_USER" --env DATABASE_PASSWORD="$DATABASE_PASSWORD" \
            --env DATABASE_NAME="$DATABASE_NAME" --env DATABASE_SSL=off \
            bpmn-v2-demo-backend:ci

          for attempt in $(seq 1 30); do
            status="$(docker run --rm --network bpmn-v2-ci curlimages/curl:8.12.1 -sS -o /dev/null -w '%{http_code}' http://backend:3000/auth/session || true)"
            if [ "$status" = "401" ]; then break; fi
            sleep 2
          done
          assert_status "401" "$status" "backend unauthenticated session"
          status="$(docker run --rm --network bpmn-v2-ci curlimages/curl:8.12.1 -sS -o /dev/null -w '%{http_code}' \
            -H 'content-type: application/json' -d '{"username":"demo-v2","password":"wrong"}' \
            http://backend:3000/auth/login || true)"
          assert_status "401" "$status" "backend invalid-password login"

          docker run --detach --name bpmn-v2-demo-frontend-ci --network bpmn-v2-ci \
            --publish 127.0.0.1:18080:80 \
            bpmn-v2-demo-frontend:ci
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/ || true)"
            if [ "$status" = "200" ]; then break; fi
            sleep 2
          done
          assert_status "200" "$status" "frontend root page"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/bpmn-tool-logo.svg)" = "200"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/bpmn-api/projects/administration/overview)"
          echo "Unauthenticated protected route returned HTTP $status"
          if [ "$status" != "401" ] && [ "$status" != "403" ] && [ "$status" != "302" ]; then
            echo "Unexpected anonymous response: HTTP $status" >&2
            exit 1
          fi

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'content-type: application/json' \
            --data '{"username":"demo-v2","password":"ci-only-demo-password"}' \
            --cookie-jar /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/login)"
          assert_status "200" "$status" "frontend demo login"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/projects/administration/overview)"
          assert_status "200" "$status" "frontend authenticated administration overview"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/session)"
          assert_status "200" "$status" "frontend authenticated session"

          # Exercise local-account administration, email login, role mapping and password reset.
          created_user="$(curl --fail --silent --show-error \
            --cookie /tmp/bpmn-v2-ci.cookies \
            --header 'content-type: application/json' \
            --data '{"username":"ci-reader","email":"ci-reader@example.com","password":"ci-only-reader-password","role":"viewer"}' \
            http://127.0.0.1:18080/bpmn-api/auth/users)"
          echo "$created_user" | grep -q '"role":"viewer"'
          reader_id="$(printf '%s' "$created_user" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/users)"
          assert_status "200" "$status" "frontend admin can list users after creation"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies \
            --request POST --header 'content-type: application/json' \
            --data '{"newPassword":"ci-reader-reset-password"}' \
            "http://127.0.0.1:18080/bpmn-api/auth/users/$reader_id/password")"
          assert_status "201" "$status" "frontend admin resets reader password"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'content-type: application/json' \
            --data '{"username":"ci-reader@example.com","password":"ci-reader-reset-password"}' \
            --cookie-jar /tmp/bpmn-v2-reader.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/login)"
          assert_status "200" "$status" "frontend reader login"

          reader_session="$(curl --fail --silent --show-error \
            --cookie /tmp/bpmn-v2-reader.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/session)"
          echo "$reader_session" | grep -q '"role":"viewer"'
          echo "$reader_session" | grep -q 'bpmn-tool-readonly-demo'

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-reader.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/users)"
          assert_status "403" "$status" "frontend viewer denied user listing"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies --cookie-jar /tmp/bpmn-v2-ci.cookies \
            --request POST \
            "http://127.0.0.1:18080/bpmn-api/auth/users/$reader_id/impersonate")"
          assert_status "200" "$status" "frontend admin starts impersonation"

          impersonated_session="$(curl --fail --silent --show-error \
            --cookie /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/session)"
          echo "$impersonated_session" | grep -q '"userId":"ci-reader"'
          echo "$impersonated_session" | grep -q '"role":"viewer"'
          echo "$impersonated_session" | grep -q '"impersonating":true'

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/users)"
          assert_status "403" "$status" "frontend impersonated viewer denied user listing"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies --cookie-jar /tmp/bpmn-v2-ci.cookies \
            --request POST http://127.0.0.1:18080/bpmn-api/auth/impersonation/stop)"
          assert_status "200" "$status" "frontend restored admin session"

          admin_session="$(curl --fail --silent --show-error \
            --cookie /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/session)"
          echo "$admin_session" | grep -q '"role":"admin"'
          echo "$admin_session" | grep -q '"impersonating":false'

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/auth/users)"
          assert_status "200" "$status" "frontend restored admin can list users"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-reader.cookies \
            --request POST --header 'content-type: application/json' \
            --data '{"currentPassword":"ci-reader-reset-password","newPassword":"ci-reader-final-password"}' \
            http://127.0.0.1:18080/bpmn-api/auth/password)"
          assert_status "201" "$status" "frontend reader password change"

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'content-type: application/json' \
            --data '{"username":"ci-reader","password":"ci-reader-final-password"}' \
            http://127.0.0.1:18080/bpmn-api/auth/login)"
          assert_status "200" "$status" "frontend reader password login"

          # Give the isolated CI reader account explicit permission to submit Viewer remarks.
          docker exec bpmn-v2-demo-db-ci psql -v ON_ERROR_STOP=1 -U "$DATABASE_USER" -d "$DATABASE_NAME" -c \
            "INSERT INTO project_members (id, \"createdBy\", \"projectId\", \"userId\", role, \"canSubmitRemarks\") VALUES (uuid_generate_v4(), 'ci-e2e', '10000000-0000-4000-8000-000000000001', 'ci-reader', 'viewer', TRUE) ON CONFLICT (\"projectId\", \"userId\") DO UPDATE SET role = EXCLUDED.role, \"canSubmitRemarks\" = TRUE"

          workspace_payload="$(curl --fail --silent --show-error \
            --cookie /tmp/bpmn-v2-ci.cookies \
            http://127.0.0.1:18080/bpmn-api/projects/me/workspace)"
          echo "$workspace_payload" | grep -q '"projects":'
          echo "$workspace_payload" | grep -q '"role":'
          echo "$workspace_payload" | grep -q '"usage":'

          # Run the complete proposal / remark workflow in a real Chromium browser.
          NODE_PATH=/tmp/bpmn-playwright/node_modules \
            BPMN_E2E_BASE_URL=http://127.0.0.1:18080 \
            DEMO_AUTH_USER="$DEMO_AUTH_USER" \
            DEMO_AUTH_PASSWORD="$DEMO_AUTH_PASSWORD" \
            CI_READER_USERNAME=ci-reader \
            CI_READER_PASSWORD=ci-reader-final-password \
            node frontend/tests/e2e/proposal-review.browser.cjs

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie /tmp/bpmn-v2-ci.cookies -X POST \
            http://127.0.0.1:18080/bpmn-api/auth/logout)"
          assert_status "200" "$status" "frontend logout"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/bpmn-api/projects/administration/overview)"
          if [ "$status" != "401" ] && [ "$status" != "403" ] && [ "$status" != "302" ]; then
            echo "Unexpected protected-route response after logout: HTTP $status" >&2
            exit 1
          fi

  deploy-coolify:
    name: Deploy to Coolify test instance
    runs-on: ubuntu-24.04
    needs:
      - frontend
      - backend
      - coolify-demo
    # Keep CI independent from Coolify credentials. Never deploy feature/PR branches;
    # only an opted-in push to main may trigger the Coolify test instance deployment.
    # Verify COOLIFY_WEBHOOK_URL and COOLIFY_TOKEN before enabling the repository variable.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.COOLIFY_DEPLOY_ENABLED == 'true'
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "::error::GitHub Actions secret COOLIFY_WEBHOOK_URL is not configured."
            exit 1
          fi
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::GitHub Actions secret COOLIFY_TOKEN is not configured."
            exit 1
          fi
          curl --fail --silent --show-error --request GET --header "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK_URL"
