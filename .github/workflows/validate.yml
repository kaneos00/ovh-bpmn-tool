name: Validate

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Build
        working-directory: frontend
        run: pnpm build

  backend:
    name: Backend lint, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: backend
        run: pnpm exec eslint "{src,apps,libs,tests}/**/*.{ts,js}"
      - name: Build
        working-directory: backend
        run: pnpm build
      - name: Unit tests
        working-directory: backend
        run: pnpm exec jest --config ./tests/jest-unit.json --runInBand
