name: BPMN Prettifier Engine

on:
  push:
    branches:
      - feat/bpmn-prettifier-engine
      - feat/bpmn-prettifier-v2-orientation-conversion
    paths:
      - "packages/bpmn-prettifier/**"
      - ".github/workflows/bpmn-prettifier.yml"
  pull_request:
    paths:
      - "packages/bpmn-prettifier/**"
      - ".github/workflows/bpmn-prettifier.yml"
  workflow_dispatch:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/bpmn-prettifier
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/bpmn-prettifier/package.json
      - name: Install package dependencies
        run: npm install
      - name: Build and test independent engine
        run: npm test
      - name: Generate Pizza Store conversion samples
        run: node test/generate-pizza-store-samples.mjs
      - name: Upload converted BPMN samples
        uses: actions/upload-artifact@v4
        with:
          name: pizza-store-orientation-samples
          path: packages/bpmn-prettifier/test-results/*.bpmn
          if-no-files-found: error
