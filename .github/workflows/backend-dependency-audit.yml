name: Backend dependency security audit

on:
  push:
    branches:
      - "**"
    paths:
      - "backend/package.json"
      - "backend/pnpm-lock.yaml"
      - "backend/scripts/check-dependency-audit.mjs"
      - "backend/security/dependency-audit-baseline.json"
      - ".github/dependabot.yml"
      - ".github/workflows/backend-dependency-audit.yml"
  pull_request:
    paths:
      - "backend/package.json"
      - "backend/pnpm-lock.yaml"
      - "backend/scripts/check-dependency-audit.mjs"
      - "backend/security/dependency-audit-baseline.json"
      - ".github/dependabot.yml"
      - ".github/workflows/backend-dependency-audit.yml"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit backend dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Run full dependency audit
        working-directory: backend
        run: |
          pnpm audit --audit-level=low > dependency-audit.log 2>&1 || audit_exit=$?
          cat dependency-audit.log
          echo "pnpm audit exit code: ${audit_exit:-0}"
      - name: Fail only on advisories newer than the reviewed baseline
        working-directory: backend
        run: node scripts/check-dependency-audit.mjs dependency-audit.log
