name: BPMN print engine fixtures

permissions:
  contents: write

on:
  pull_request:
    branches:
      - v2.3
    paths:
      - "packages/bpmn-print-engine/**"
      - ".github/workflows/bpmn-print-engine-fixtures.yml"
  push:
    branches:
      - feat/bpmn-print-engine-architecture
      - feat/bpmn-print-engine-pizza-store-reference
    paths:
      - "packages/bpmn-print-engine/**"
      - ".github/workflows/bpmn-print-engine-fixtures.yml"
  workflow_dispatch:

jobs:
  generate-and-validate-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate per-page BPMN review fixtures
        run: python3 packages/bpmn-print-engine/scripts/generate-fixtures.py
      - name: Generate two A4 portrait pages from Pizza-Store
        run: python3 packages/bpmn-print-engine/scripts/generate-pizza-store-pages.py
      - name: Validate generated BPMN fixtures and Pizza-Store pages
        run: python3 -m unittest discover -s packages/bpmn-print-engine/tests -p 'test_*.py' -v
      - name: Publish generated two-page BPMN files to the branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/bpmn-print-engine/tests/fixtures/generated/pizza-store-page-*.bpmn
          if ! git diff --cached --quiet; then
            git commit -m "test(bpmn-print-engine): publish generated portrait pages"
            git push
          fi
      - name: Upload generated BPMN page fixtures
        uses: actions/upload-artifact@v4
        with:
          name: pizza-store-a4-portrait-two-pages
          path: packages/bpmn-print-engine/tests/fixtures/generated/pizza-store-page-*.bpmn
          if-no-files-found: error
