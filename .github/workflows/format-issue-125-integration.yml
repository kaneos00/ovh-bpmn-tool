name: Format issue 125 V3 integration

on:
  push:
    branches:
      - feat/issue-125-v3-integration

permissions:
  contents: write
  actions: write

jobs:
  format:
    name: Format integration files and dispatch validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Format backend integration files
        working-directory: backend
        run: >-
          pnpm exec prettier --write
          src/modules/ProjectContext/infrastructure/controllers/process-change-proposal.controller.ts
          src/modules/ProjectContext/infrastructure/controllers/process-change-proposal.controller.spec.ts
          src/modules/ProjectContext/infrastructure/controllers/project.controller.ts
          src/modules/ProjectContext/infrastructure/entities/processChangeProposal.ormEntity.ts
          src/modules/ProjectContext/infrastructure/entities/processChangeProposalComment.ormEntity.ts
          src/modules/ProjectContext/infrastructure/entities/processChangeProposalEvent.ormEntity.ts
          src/modules/ProjectContext/infrastructure/entities/projectMember.ormEntity.ts
          src/modules/ProjectContext/projectResourceAccess.service.ts

      - name: Format frontend integration files
        working-directory: frontend
        run: >-
          pnpm exec prettier --write
          src/Components/BusinessComponents/ProcessViewer/hooks/useProcessViewer.ts
          src/Containers/ContentModeler/ContentModeler.container.tsx
          src/Containers/ContentViewer/ContentViewer.container.tsx
          src/Containers/Projects/Projects.container.tsx
          tests/viewer-interactions.test.mjs

      - name: Commit formatting changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/ProjectContext frontend/src/Components/BusinessComponents/ProcessViewer/hooks/useProcessViewer.ts frontend/src/Containers/ContentModeler/ContentModeler.container.tsx frontend/src/Containers/ContentViewer/ContentViewer.container.tsx frontend/src/Containers/Projects/Projects.container.tsx frontend/tests/viewer-interactions.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(#125): format V3 integration files"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Dispatch validation for the formatted branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/kaneos00/ovh-bpmn-tool/actions/workflows/validate.yml/dispatches \
            --data "{\"ref\":\"$GITHUB_REF_NAME\"}"
