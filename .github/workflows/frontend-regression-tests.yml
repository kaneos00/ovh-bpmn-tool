name: Frontend regression tests

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-regression-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-regression-tests:
    name: Frontend regression contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run deterministic viewer regression tests
        run: node --test frontend/tests/ui-regression.test.mjs frontend/tests/viewer-interactions.test.mjs
