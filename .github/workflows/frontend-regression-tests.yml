name: Frontend regression tests

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-regression-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-regression-tests:
    name: Frontend regression contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run deterministic viewer regression tests
        run: node --test frontend/tests/ui-regression.test.mjs frontend/tests/viewer-interactions.test.mjs

  frontend-unit-tests:
    name: Frontend business unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Compile isolated modules and run frontend business unit tests
        working-directory: frontend
        run: pnpm test:unit
      - name: Run pagination engine unit and regression tests
        working-directory: frontend
        run: pnpm test:pagination
