name: One-shot backend formatting

on:
  push:
    branches:
      - chore/format-proposal-controller-ci

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Format the two files reported by CI
        working-directory: backend
        run: pnpm exec prettier --write src/modules/ProjectContext/infrastructure/controllers/process-change-proposal.controller.ts src/modules/ProjectContext/infrastructure/controllers/process-change-proposal.controller.spec.ts
      - name: Backend lint
        working-directory: backend
        run: pnpm exec eslint "{src,apps,libs,tests}/**/*.{ts,js}"
      - name: Backend build
        working-directory: backend
        run: pnpm build
      - name: Backend unit tests
        working-directory: backend
        run: pnpm exec jest --config ./tests/jest-unit.json --runInBand
      - name: Commit formatting and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/ProjectContext/infrastructure/controllers/process-change-proposal.controller.ts backend/src/modules/ProjectContext/infrastructure/controllers/process-change-proposal.controller.spec.ts
          git rm .github/workflows/format-backend-once.yml
          git diff --cached --check
          git commit -m "style: format process change proposal controller"
          git push origin HEAD:chore/format-proposal-controller-ci
